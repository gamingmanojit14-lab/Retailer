<!DOCTYPE html><html lang="bn"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ইনভয়েস — TextilePOS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css">
</head><body>
<div id="app"></div>
<script src="db.js"></script><script src="common.js"></script>
<script>
APP.init('invoices',render);
async function render(){
  const sales=(await DB.all('sales')).sort((a,b)=>new Date(b.saleDate)-new Date(a.saleDate));
  document.getElementById('pageContent').innerHTML=`
    <h1 class="page-title">🧾 ইনভয়েস (${sales.length})</h1>
    <input class="input mb-3" placeholder="🔍 ইনভয়েস/কাস্টমার খুঁজুন..." oninput="filt(this.value)"/>
    <div id="list">
      ${sales.map(s=>`
        <div class="card inv-item" data-name="${esc((s.invoiceNo+(s.customerName||'')).toLowerCase())}" onclick="viewInv(${s.id})" style="cursor:pointer;">
          <div class="flex justify-between">
            <div>
              <div style="font-weight:600;font-size:13px;">${esc(s.invoiceNo)}</div>
              <div class="text-sm text-slate">${esc(s.customerName||'ওয়াক-ইন')} • ${fmtDateTime(s.saleDate)}</div>
              <div class="text-xs text-slate">${s.items.length} আইটেম • ${s.type==='wholesale'?'হোলসেল':'রিটেল'}</div>
            </div>
            <div class="text-right">
              <div style="font-weight:700;">${bdt(s.total)}</div>
              <div class="text-xs ${s.due>0?'text-red':'text-green'}">${s.due>0?'বাকি: '+bdt(s.due):'✓ পরিশোধ'}</div>
            </div>
          </div>
        </div>`).join('')}
      ${sales.length===0?'<div class="card text-center text-slate" style="padding:32px;">কোনো ইনভয়েস নেই</div>':''}
    </div>`;
}
window.filt=function(q){
  q=q.toLowerCase();
  document.querySelectorAll('.inv-item').forEach(el=>{
    el.style.display=el.dataset.name.includes(q)?'':'none';
  });
};
window.viewInv=async id=>{
  const s=await DB.get('sales',id);
  const shop=JSON.parse(localStorage.getItem('textile-user')).shop||'আমার দোকান';
  openModal('invM',`
    <div id="invPrint">
      <div style="text-align:center;border-bottom:1px dashed #cbd5e1;padding-bottom:12px;margin-bottom:12px;">
        <div style="font-size:20px;font-weight:700;">${esc(shop)}</div>
        <div class="text-xs text-slate">ইনভয়েস: ${esc(s.invoiceNo)}</div>
        <div class="text-xs text-slate">${fmtDateTime(s.saleDate)}</div>
      </div>
      <div class="text-sm mb-2"><b>কাস্টমার:</b> ${esc(s.customerName||'ওয়াক-ইন')}</div>
      ${s.items.map(i=>`
        <div class="flex justify-between text-sm" style="padding:4px 0;border-bottom:1px dotted #e2e8f0;">
          <span>${esc(i.name)} × ${i.qty}</span>
          <span>${bdt(i.qty*i.rate)}</span>
        </div>`).join('')}
      <div class="mt-2">
        <div class="flex justify-between text-sm"><span>সাবটোটাল</span><span>${bdt(s.subtotal)}</span></div>
        <div class="flex justify-between text-sm"><span>ডিসকাউন্ট</span><span>-${bdt(s.discount)}</span></div>
        <div class="flex justify-between" style="font-weight:700;font-size:16px;border-top:1px solid #cbd5e1;padding-top:6px;margin-top:6px;">
          <span>মোট</span><span>${bdt(s.total)}</span>
        </div>
        <div class="flex justify-between text-sm text-green"><span>পরিশোধ</span><span>${bdt(s.paid)}</span></div>
        ${s.due>0?`<div class="flex justify-between text-sm text-red"><span>বাকি</span><span>${bdt(s.due)}</span></div>`:''}
      </div>
      <div style="text-align:center;margin-top:14px;font-size:11px;color:#94a3b8;">
        ধন্যবাদ! আবার আসবেন 🙏
      </div>
    </div>
    <div class="grid-2 mt-3">
      <button class="btn btn-outline" onclick="closeModal('invM')">বন্ধ</button>
      <button class="btn btn-primary" onclick="printInv()">🖨️ প্রিন্ট</button>
    </div>`);
};
window.printInv=()=>{
  const content=document.getElementById('invPrint').innerHTML;
  const w=window.open('','','width=400,height=600');
  w.document.write(`<html><head><title>Invoice</title>
    <style>body{font-family:sans-serif;padding:10px;font-size:12px;}
    .flex{display:flex;justify-content:space-between;}
    .text-slate{color:#64748b;}.text-green{color:#16a34a;}.text-red{color:#dc2626;}
    .text-xs{font-size:11px;}.text-sm{font-size:12px;}
    .mt-2{margin-top:8px;}.mb-2{margin-bottom:8px;}</style></head>
    <body onload="window.print()">${content}</body></html>`);
  w.document.close();
};
</script></body></html>
