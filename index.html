<body>
<div id="app"></div>
<div id="toastWrap" style="position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:200;pointer-events:none;"></div>

<script>
/* ============================================================
   TextilePOS — Single File App
   Admin + Salesman | Offline | IndexedDB | Print Invoice
   ============================================================ */

// ============ DB Layer (IndexedDB) ============
const DB_NAME = 'TextilePOS', DB_VERSION = 1;
let db = null;

function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VERSION);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      ['users','products','customers','sales','payments'].forEach(n => {
        if (!d.objectStoreNames.contains(n)) {
          const store = d.createObjectStore(n, { keyPath: 'id', autoIncrement: true });
          if (n === 'sales') store.createIndex('salesmanId', 'salesmanId');
          if (n === 'customers') store.createIndex('phone', 'phone');
        }
      });
    };
    r.onsuccess = () => { db = r.result; res(db); };
    r.onerror = () => rej(r.error);
  });
}
function txn(s, m = 'readonly') { return db.transaction(s, m).objectStore(s); }

const DB = {
  add: (s, d) => new Promise((res, rej) => { const r = txn(s, 'readwrite').add(d); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }),
  put: (s, d) => new Promise((res, rej) => { const r = txn(s, 'readwrite').put(d); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }),
  get: (s, id) => new Promise((res, rej) => { const r = txn(s).get(id); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }),
  all: s => new Promise((res, rej) => { const r = txn(s).getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); }),
  del: (s, id) => new Promise((res, rej) => { const r = txn(s, 'readwrite').delete(id); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }),
  clear: s => new Promise((res, rej) => { const r = txn(s, 'readwrite').clear(); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }),
  byIndex: (s, idx, val) => new Promise((res, rej) => { const r = txn(s).index(idx).getAll(val); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); })
};

// ============ Utilities ============
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const bdt = n => '৳ ' + (Number(n) || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
const fmtDate = d => new Date(d).toLocaleDateString('bn-BD', { day: 'numeric', month: 'short', year: 'numeric' });
const fmtDateTime = d => new Date(d).toLocaleString('bn-BD', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const todayKey = () => new Date().toISOString().slice(0, 10);

function toast(msg, type = 'info') {
  const colors = { info: '#0f172a', success: '#16a34a', error: '#dc2626', warn: '#f59e0b' };
  const el = document.createElement('div');
  el.style.cssText = `background:${colors[type]};color:#fff;padding:10px 20px;border-radius:10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:90%;text-align:center;margin-bottom:6px;`;
  el.textContent = msg;
  $('toastWrap').appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

function confirmBox(msg) {
  return new Promise(res => {
    const ov = document.createElement('div');
    ov.className = 'overlay';
    ov.innerHTML = `<div class="modal" style="max-width:380px;">
      <p style="margin:0 0 16px;font-size:15px;">${esc(msg)}</p>
      <div class="grid-2">
        <button class="btn btn-outline" data-act="no">না</button>
        <button class="btn btn-danger" data-act="yes">হ্যাঁ</button>
      </div></div>`;
    document.body.appendChild(ov);
    ov.addEventListener('click', e => {
      const a = e.target.dataset?.act;
      if (a === 'no') { ov.remove(); res(false); }
      if (a === 'yes') { ov.remove(); res(true); }
    });
  });
}

// Print HTML in hidden iframe
function printHTML(html) {
  const iframe = document.createElement('iframe');
  iframe.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;';
  document.body.appendChild(iframe);
  const doc = iframe.contentDocument;
  doc.open(); doc.write(html); doc.close();
  iframe.onload = () => {
    setTimeout(() => {
      iframe.contentWindow.focus();
      iframe.contentWindow.print();
      setTimeout(() => iframe.remove(), 2000);
    }, 200);
  };
}

// ============ Sync Layer (BroadcastChannel) ============
const syncChannel = ('BroadcastChannel' in window) ? new BroadcastChannel('textilepos-sync') : null;
function broadcast(type) {
  if (syncChannel) syncChannel.postMessage({ type, at: Date.now() });
}
if (syncChannel) {
  syncChannel.onmessage = e => {
    if (e.data?.type === 'data-changed') {
      // refresh current view
      if (App.user) App.render();
    }
  };
}

// ============ Business Logic ============
async function generateInvoiceNo() {
  const all = await DB.all('sales');
  const t = new Date();
  const ymd = `${t.getFullYear()}${String(t.getMonth() + 1).padStart(2, '0')}${String(t.getDate()).padStart(2, '0')}`;
  const prefix = `INV-${ymd}-`;
  const n = all.filter(s => s.invoiceNo?.startsWith(prefix)).length + 1;
  return `${prefix}${String(n).padStart(4, '0')}`;
}

async function findOrCreateCustomer({ id, name, phone }) {
  if (id) return DB.get('customers', id);
  if (!name) return null;
  const all = await DB.all('customers');
  let found = phone ? all.find(c => c.phone === phone) : null;
  if (!found) found = all.find(c => c.name === name && !phone);
  if (found) return found;
  const newId = await DB.add('customers', { name, phone: phone || '', due: 0, createdAt: new Date().toISOString() });
  return DB.get('customers', newId);
}

async function createSale({ items, customerInfo, discount, paid, paymentMethod, note, salesmanId, salesmanName, type }) {
  const invoiceNo = await generateInvoiceNo();
  const customer = await findOrCreateCustomer(customerInfo);
  const subtotal = items.reduce((s, i) => s + i.qty * i.rate, 0);
  const total = subtotal - (discount || 0);
  const due = total - (paid || 0);

  const sale = {
    invoiceNo,
    customerId: customer?.id || null,
    customerName: customer?.name || 'ওয়াক-ইন কাস্টমার',
    customerPhone: customer?.phone || '',
    salesmanId,
    salesmanName,
    type: type || 'retail',
    items: items.map(i => ({ productId: i.productId, name: i.name, qty: i.qty, rate: i.rate, total: i.qty * i.rate })),
    subtotal, discount: discount || 0, total, paid: paid || 0, due,
    paymentMethod: paymentMethod || 'cash',
    note: note || '',
    saleDate: new Date().toISOString()
  };

  const saleId = await DB.add('sales', sale);
  sale.id = saleId;

  // stock update
  for (const it of items) {
    const p = await DB.get('products', it.productId);
    if (p) { p.stockQty = (p.stockQty || 0) - it.qty; await DB.put('products', p); }
  }

  // customer due
  if (customer && due > 0) {
    customer.due = (customer.due || 0) + due;
    await DB.put('customers', customer);
  }

  // payment record
  if (paid > 0 && customer) {
    await DB.add('payments', {
      customerId: customer.id, customerName: customer.name,
      amount: paid, method: paymentMethod || 'cash',
      note: `Sale ${invoiceNo}`, salesmanName,
      paymentDate: new Date().toISOString()
    });
  }

  broadcast('data-changed');
  return sale;
}

// ============ Invoice HTML Builder ============
function buildInvoiceHTML(sale, opts = {}) {
  const shop = opts.shopName || 'আমার দোকান';
  const addr = opts.shopAddr || '';
  const phone = opts.shopPhone || '';
  const items = sale.items.map((it, i) => `
    <tr>
      <td style="padding:6px 4px;border-bottom:1px solid #e5e7eb;text-align:center;">${i + 1}</td>
      <td style="padding:6px 4px;border-bottom:1px solid #e5e7eb;">${esc(it.name)}</td>
      <td style="padding:6px 4px;border-bottom:1px solid #e5e7eb;text-align:right;">${it.qty}</td>
      <td style="padding:6px 4px;border-bottom:1px solid #e5e7eb;text-align:right;">${bdt(it.rate)}</td>
      <td style="padding:6px 4px;border-bottom:1px solid #e5e7eb;text-align:right;">${bdt(it.total)}</td>
    </tr>`).join('');

  return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${esc(sale.invoiceNo)}</title>
  <style>
    *{font-family:'Noto Sans Bengali',Arial,sans-serif;box-sizing:border-box}
    body{margin:0;padding:14px;color:#111;font-size:13px;max-width:340px}
    .head{text-align:center;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:10px}
    .head h1{margin:0;font-size:20px}
    .head p{margin:2px 0;font-size:11px}
    .row{display:flex;justify-content:space-between;font-size:11px;margin:2px 0}
    table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}
    th{background:#f3f4f6;padding:5px 4px;text-align:left;font-size:11px;border-bottom:2px solid #111}
    .total-block{margin-top:8px;border-top:2px solid #111;padding-top:6px}
    .total-block .row{font-size:13px;margin:4px 0}
    .grand{font-size:17px;font-weight:700}
    .foot{text-align:center;margin-top:14px;font-size:11px;border-top:1px dashed #999;padding-top:8px}
    @media print{body{padding:6px} .no-print{display:none}}
  </style></head><body>
    <div class="head">
      <h1>${esc(shop)}</h1>
      ${addr ? `<p>${esc(addr)}</p>` : ''}
      ${phone ? `<p>মোবাইল: ${esc(phone)}</p>` : ''}
    </div>
    <div class="row"><b>ইনভয়েস:</b><span>${esc(sale.invoiceNo)}</span></div>
    <div class="row"><b>তারিখ:</b><span>${fmtDateTime(sale.saleDate)}</span></div>
    <div class="row"><b>কাস্টমার:</b><span>${esc(sale.customerName)}</span></div>
    ${sale.customerPhone ? `<div class="row"><b>মোবাইল:</b><span>${esc(sale.customerPhone)}</span></div>` : ''}
    ${sale.salesmanName ? `<div class="row"><b>সেলসম্যান:</b><span>${esc(sale.salesmanName)}</span></div>` : ''}

    <table>
      <thead><tr>
        <th style="width:24px;text-align:center">#</th>
        <th>আইটেম</th>
        <th style="text-align:right">পরিমাণ</th>
        <th style="text-align:right">দর</th>
        <th style="text-align:right">মোট</th>
      </tr></thead>
      <tbody>${items}</tbody>
    </table>

    <div class="total-block">
      <div class="row"><span>সাবটোটাল</span><span>${bdt(sale.subtotal)}</span></div>
      ${sale.discount ? `<div class="row"><span>ডিসকাউন্ট</span><span>-${bdt(sale.discount)}</span></div>` : ''}
      <div class="row grand"><span>মোট</span><span>${bdt(sale.total)}</span></div>
      <div class="row"><span>পরিশোধ</span><span>${bdt(sale.paid)}</span></div>
      ${sale.due > 0 ? `<div class="row" style="color:#b91c1c;font-weight:700"><span>বাকি</span><span>${bdt(sale.due)}</span></div>` : ''}
      <div class="row" style="font-size:11px;color:#555"><span>পেমেন্ট</span><span>${esc(sale.paymentMethod)}</span></div>
    </div>
    <div class="foot">ধন্যবাদ! আবার আসবেন 🙏</div>
  </body></html>`;
}

// ============ App State & Router ============
const App = {
  user: null,          // {id, name, role: 'admin'|'salesman'}
  page: 'dashboard',
  cart: [],
  customerSel: { mode: 'walkin', id: null, name: '', phone: '' },
  discount: 0,
  paid: 0,
  method: 'cash',
  saleType: 'retail',
  mobileDrawer: false,

  async login(role, name, password) {
    if (role === 'admin') {
      // default admin credentials: admin / admin123
      if (name !== 'admin' || password !== 'admin123') {
        const users = await DB.all('users');
        const u = users.find(u => u.role === 'admin' && u.name === name && u.password === password);
        if (!u) throw new Error('ভুল ইউজারনেম বা পাসওয়ার্ড');
        this.setUser(u);
        return;
      }
      this.setUser({ id: 0, name: 'Admin', role: 'admin' });
      return;
    }
    // salesman
    const users = await DB.all('users');
    const u = users.find(u => u.role === 'salesman' && u.name === name && u.password === password);
    if (!u) throw new Error('ভুল ইউজারনেম বা পাসওয়ার্ড');
    this.setUser(u);
  },

  setUser(user) {
    this.user = user;
    localStorage.setItem('textilepos-user', JSON.stringify(user));
    this.page = user.role === 'admin' ? 'dashboard' : 'pos';
    this.render();
  },

  logout() {
    this.user = null;
    localStorage.removeItem('textilepos-user');
    this.render();
  },

  go(page) { this.page = page; this.mobileDrawer = false; this.render(); },

  async render() {
    const root = $('app');
    if (!this.user) { root.innerHTML = LoginView(); return; }
    const layout = LayoutView();
    root.innerHTML = layout.html;
    const content = $('pageContent');
    const fn = Pages[this.page];
    if (fn) content.innerHTML = await fn();
    attachPageEvents();
  }
};

// ============ Login View ============
function LoginView() {
  return `
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#2563eb,#4f46e5);padding:16px;">
      <div class="card" style="width:100%;max-width:420px;">
        <div class="text-center mb-4">
          <div style="font-size:56px;line-height:1;">🧵</div>
          <h1 style="font-size:24px;font-weight:700;margin:8px 0 4px;">TextilePOS</h1>
          <p class="text-slate text-xs">কাপড়ের ব্যবসার সফটওয়্যার</p>
          <p class="text-green text-xs mt-1">💾 সব ডেটা আপনার ডিভাইসে</p>
        </div>

        <div class="grid-2 mb-3">
          <button class="btn btn-primary" id="roleAdmin" style="padding:16px 10px;flex-direction:column;">
            <span style="font-size:26px;">👑</span><span>অ্যাডমিন</span>
          </button>
          <button class="btn btn-outline" id="roleSales" style="padding:16px 10px;flex-direction:column;">
            <span style="font-size:26px;">🧑‍💼</span><span>সেলসম্যান</span>
          </button>
        </div>

        <div id="loginForm" style="display:none;">
          <label class="text-xs text-slate">ইউজারনেম</label>
          <input class="input mb-2" id="lgName" placeholder="নাম" autocomplete="off" />
          <label class="text-xs text-slate">পাসওয়ার্ড</label>
          <input class="input mb-3" id="lgPass" type="password" placeholder="পাসওয়ার্ড" />
          <button class="btn btn-primary btn-block btn-lg" id="lgBtn">লগইন</button>
          <p class="text-xs text-slate text-center mt-3" id="hint"></p>
        </div>

        <p class="text-xs text-slate text-center mt-4">
          🔒 কোনো সার্ভার নেই • ইন্টারনেট ছাড়াই চলে
        </p>
      </div>
    </div>`;
}

function attachLoginEvents() {
  const adminBtn = $('roleAdmin'), salesBtn = $('roleSales');
  const form = $('loginForm'), hint = $('hint'), nameI = $('lgName'), passI = $('lgPass'), btn = $('lgBtn');
  if (!adminBtn) return;

  let currentRole = null;

  adminBtn.onclick = () => {
    currentRole = 'admin';
    form.style.display = 'block';
    adminBtn.className = 'btn btn-primary';
    salesBtn.className = 'btn btn-outline';
    hint.textContent = 'ডিফল্ট: admin / admin123';
    nameI.value = 'admin'; passI.value = 'admin123';
  };
  salesBtn.onclick = async () => {
    currentRole = 'salesman';
    form.style.display = 'block';
    salesBtn.className = 'btn btn-primary';
    adminBtn.className = 'btn btn-outline';
    const users = await DB.all('users');
    const salesmen = users.filter(u => u.role === 'salesman');
    hint.textContent = salesmen.length ? 'আপনার অ্যাডমিনের দেওয়া লগইন ব্যবহার করুন' : '⚠️ এখনো কোনো সেলসম্যান তৈরি হয়নি। অ্যাডমিন প্যানেল থেকে যোগ করুন।';

function attachPageEvents() {
  // login page
  if (!App.user) { attachLoginEvents(); return; }

  // drawer & nav
  const drawer = $('drawer'), backdrop = $('backdrop');
  const openDrawer = () => { drawer.classList.add('open'); backdrop.classList.add('open'); };
  const closeDrawer = () => { drawer.classList.remove('open'); backdrop.classList.remove('open'); };

  const db1 = $('drawerBtn'); if (db1) db1.onclick = openDrawer;
  backdrop.onclick = closeDrawer;
  $('logoutBtn').onclick = () => App.logout();

  document.querySelectorAll('[data-page]').forEach(el => {
    el.onclick = () => { App.go(el.dataset.page); };
  });

  // page-specific events
  const fn = PageEvents[App.page];
  if (fn) fn();
}

Pages.dashboard = async () => {

  const todayTotal = todaySales.reduce((s, x) => s + x.total, 0);

  const salesmen = users.filter(u => u.role === 'salesman');

  return `

  if (newName) newName.oninput = () => { App.customerSel.name = newName.value; };

  if (disc) disc.oninput = () => { App.discount = Number(disc.value) || 0; updatePOSSummary(); };

function updatePOSSummary() {
  const subtotal = App.cart.reduce((s, i) => s + i.qty * i.rate, 0);
  const total = subtotal - App.discount;
  const due = total - App.paid;
  // Simple: re-render
  App.render();
}

async function addToCart(productId) {
  const p = await DB.get('products', productId);
  if (!p) return;
  if (p.stockQty <= 0) return toast('স্টক নেই!', 'error');
  const rate = App.saleType === 'wholesale' ? p.wholesalePrice : p.retailPrice;
  const ex = App.cart.find(i => i.productId === productId);
  if (ex) ex.qty += 1;
  else App.cart.push({ productId, name: p.name, qty: 1, rate });
  App.render();
}

async function submitSaleHandler() {
  if (!App.cart.length) return toast('কার্ট খালি', 'error');
  const sel = App.customerSel;
  let customerInfo = {};

  if (sel.mode === 'existing' && sel.id) customerInfo = { id: sel.id };
  else if (sel.mode === 'new') {
    if (!sel.name?.trim()) return toast('নতুন কাস্টমারের নাম লিখুন', 'error');
    customerInfo = { name: sel.name.trim(), phone: sel.phone?.trim() || '' };
  }

  try {
    const sale = await createSale({
      items: App.cart,
      customerInfo,
      discount: App.discount,
      paid: App.paid,
      paymentMethod: App.method,
      salesmanId: App.user.id,
      salesmanName: App.user.name,
      type: App.saleType
    });

    // reset
    App.cart = []; App.discount = 0; App.paid = 0;
    App.customerSel = { mode: 'walkin', id: null, name: '', phone: '' };

    toast('✅ বিক্রয় সম্পন্ন! ' + sale.invoiceNo, 'success');
    App.render();
    setTimeout(() => openInvoiceModal(sale.id), 300);
  } catch (e) {
    toast('ব্যর্থ: ' + e.message, 'error');
  }
}

// -- sync
PageEvents.sync = () => {
  const dlBtn = $('dlBackup');
  if (dlBtn) dlBtn.onclick = async () => {
    const data = { exportedAt: new Date().toISOString(), version: 1 };
    for (const s of ['users', 'products', 'customers', 'sales', 'payments']) {
      data[s] = await DB.all(s);
    }
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `textilepos-backup-${todayKey()}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
    toast('ব্যাকআপ ডাউনলোড হয়েছে', 'success');
  };

  const inp = $('restoreInput');
  if (inp) inp.onchange = async e => {
    const f = e.target.files[0];
    if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      let added = 0, updated = 0;
      // merge by id
      for (const store of ['products', 'customers', 'sales', 'payments', 'users']) {
        if (!data[store]) continue;
        const existing = await DB.all(store);
        const existingIds = new Set(existing.map(x => x.id));
        for (const item of data[store]) {
          if (existingIds.has(item.id)) {
            await DB.put(store, item);
            updated++;
          } else {
            // add without id so it gets new one? No - keep id to avoid dup
            try { await DB.add(store, item); added++; } catch (err) { /* skip dup */ }
          }
        }
      }
      broadcast('data-changed');
      toast(`✅ মার্জ: ${added} নতুন, ${updated} আপডেট`, 'success');
      App.render();
    } catch (err) {
      toast('ফাইল পড়া যায়নি: ' + err.message, 'error');
    }
  };

  const clearBtn = $('clearAll');
  if (clearBtn) clearBtn.onclick = async () => {
    if (!await confirmBox('সব ডেটা মুছে যাবে! নিশ্চিত?')) return;
    for (const s of ['products', 'customers', 'sales', 'payments', 'users']) await DB.clear(s);
    broadcast('data-changed');
    toast('সব ডেটা মুছে ফেলা হয়েছে', 'success');
    App.render();
  };
};

    <table style="width:100%;border-collapse:collapse;margin-top:10px;">
      <thead><tr style="background:#f3f4f6;">
        <th style="padding:5px 4px;text-align:center;font-size:11px;width:24px;">#</th>
        <th style="padding:5px 4px;text-align:left;font-size:11px;">আইটেম</th>
        <th style="padding:5px 4px;text-align:right;font-size:11px;">পরিমাণ</th>
        <th style="padding:5px 4px;text-align:right;font-size:11px;">দর</th>
        <th style="padding:5px 4px;text-align:right;font-size:11px;">মোট</th>
      </tr></thead>
      <tbody>${items}</tbody>
    </table>
    <div style="border-top:2px solid #111;margin-top:10px;padding-top:8px;">
      <div class="flex justify-between text-sm" style="margin:4px 0;"><span>সাবটোটাল</span><b>${bdt(sale.subtotal)}</b></div>
      ${sale.discount ? `<div class="flex justify-between text-sm" style="margin:4px 0;"><span>ডিসকাউন্ট</span><b>-${bdt(sale.discount)}</b></div>` : ''}
      <div class="flex justify-between" style="margin:6px 0;font-size:17px;font-weight:700;"><span>মোট</span><span>${bdt(sale.total)}</span></div>
      <div class="flex justify-between text-sm" style="margin:4px 0;"><span>পরিশোধ</span><b class="text-green">${bdt(sale.paid)}</b></div>
      ${sale.due > 0 ? `<div class="flex justify-between text-sm text-red" style="margin:4px 0;font-weight:700;"><span>বাকি</span><b>${bdt(sale.due)}</b></div>` : ''}
    </div>
    <div class="text-center text-xs text-slate mt-3" style="border-top:1px dashed #cbd5e1;padding-top:8px;">ধন্যবাদ! আবার আসবেন 🙏</div>`;
}

// -- Salesman Form
function openSalesmanForm() {
  const ov = document.createElement('div');
  ov.className = 'overlay'; ov.id = 'smForm';
  ov.innerHTML = `
    <div class="modal">
      <h2 style="font-size:18px;font-weight:700;margin:0 0 16px;">🧑‍💼 নতুন সেলসম্যান</h2>
      <label class="text-xs text-slate">নাম</label>
      <input class="input mb-2" id="smName" placeholder="সেলসম্যানের নাম" />
      <label class="text-xs text-slate">লগইন ইউজারনেম</label>
      <input class="input mb-2" id="smUser" placeholder="লগইনের নাম" />
      <label class="text-xs text-slate">পাসওয়ার্ড</label>
      <input class="input mb-3" id="smPass" placeholder="পাসওয়ার্ড" />
      <div class="grid-2">
        <button class="btn btn-outline" data-close>বাতিল</button>
        <button class="btn btn-primary" id="smSave">সেভ</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  ov.querySelector('[data-close]').onclick = () => ov.remove();
  ov.querySelector('#smSave').onclick = async () => {
    const name = $('smName').value.trim();
    const user = $('smUser').value.trim() || name;
    const pass = $('smPass').value.trim();
    if (!name || !user || !pass) return toast('সব তথ্য দিন', 'error');
    await DB.add('users', { name: user, displayName: name, password: pass, role: 'salesman', createdAt: new Date().toISOString() });
    broadcast('data-changed');
    toast('সেলসম্যান যোগ হয়েছে', 'success');
    ov.remove();
    App.render();
  };
}

// -- Customer Form
function openCustomerForm() {
  const ov = document.createElement('div');
  ov.className = 'overlay'; ov.id = 'custForm';
  ov.innerHTML = `
    <div class="modal">
      <h2 style="font-size:18px;font-weight:700;margin:0 0 16px;">👤 নতুন কাস্টমার</h2>
      <input class="input mb-2" id="cfName" placeholder="নাম *" />
      <input class="input mb-2" id="cfPhone" placeholder="মোবাইল" />
      <input class="input mb-3" id="cfAddr" placeholder="ঠিকানা" />
      <div class="grid-2">
        <button class="btn btn-outline" data-close>বাতিল</button>
        <button class="btn btn-primary" id="cfSave">সেভ</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  ov.querySelector('[data-close]').onclick = () => ov.remove();
  ov.querySelector('#cfSave').onclick = async () => {
    const name = $('cfName').value.trim();
    if (!name) return toast('নাম দিন', 'error');
    await DB.add('customers', {
      name, phone: $('cfPhone').value.trim(), address: $('cfAddr').value.trim(),
      due: 0, createdAt: new Date().toISOString()
    });
    broadcast('data-changed');
    toast('যোগ হয়েছে', 'success');
    ov.remove();
    App.render();
  };
}

// -- Payment Form
function openPaymentForm(customerId) {
  DB.get('customers', customerId).then(c => {
    if (!c) return;
    const ov = document.createElement('div');
    ov.className = 'overlay'; ov.id = 'payForm';
    ov.innerHTML = `
      <div class="modal">
        <h2 style="font-size:18px;font-weight:700;margin:0 0 4px;">💵 পেমেন্ট গ্রহণ</h2>
        <p class="text-sm text-slate mb-3">${esc(c.name)} — বাকি: <b class="text-red">${bdt(c.due)}</b></p>
        <input type="number" class="input mb-2" id="pfAmt" placeholder="টাকার পরিমাণ *" />
        <select class="input mb-3" id="pfMethod">
          <option value="cash">ক্যাশ</option><option value="bkash">বিকাশ</option>
          <option value="nagad">নগদ</option><option value="rocket">রকেট</option>
          <option value="bank">ব্যাংক</option>
        </select>
        <div class="grid-2">
          <button class="btn btn-outline" data-close>বাতিল</button>
          <button class="btn btn-primary" id="pfSave">সেভ</button>
        </div>
      </div>`;
    document.body.appendChild(ov);
    ov.querySelector('[data-close]').onclick = () => ov.remove();
    ov.querySelector('#pfSave').onclick = async () => {
      const amt = Number($('pfAmt').value) || 0;
      if (amt <= 0) return toast('পরিমাণ দিন', 'error');
      const method = $('pfMethod').value;
      const fresh = await DB.get('customers', customerId);
      if (!fresh) return;
      fresh.due = Math.max(0, (fresh.due || 0) - amt);
      await DB.put('customers', fresh);
      await DB.add('payments', {
        customerId, customerName: fresh.name, amount: amt, method,
        note: 'Manual collection', paymentDate: new Date().toISOString()
      });
      broadcast('data-changed');
      toast('✅ পেমেন্ট সম্পন্ন', 'success');
      ov.remove();
      App.render();
    };
  });
}

// -- Product Form
async function openProductForm(p = null) {
  const ov = document.createElement('div');
  ov.className = 'overlay'; ov.id = 'prodForm';
  ov.innerHTML = `
    <div class="modal">
      <h2 style="font-size:18px;font-weight:700;margin:0 0 16px;">${p ? 'এডিট প্রোডাক্ট' : '📦 নতুন প্রোডাক্ট'}</h2>
      <input class="input mb-2" id="pfName" placeholder="প্রোডাক্টের নাম *" value="${esc(p?.name || '')}" />
      <input class="input mb-2" id="pfUnit" placeholder="ইউনিট (পিস/গজ)" value="${esc(p?.unit || 'পিস')}" />
      <input type="number" class="input mb-2" id="pfWhole" placeholder="হোলসেল দাম" value="${p?.wholesalePrice || ''}" />
      <input type="number" class="input mb-2" id="pfRetail" placeholder="রিটেল দাম" value="${p?.retailPrice || ''}" />
      <input type="number" class="input mb-2" id="pfStock" placeholder="স্টক পরিমাণ" value="${p?.stockQty || ''}" />
      <input type="number" class="input mb-3" id="pfLow" placeholder="লো স্টক অ্যালার্ট" value="${p?.lowStockAlert || 5}" />
      <div class="grid-2">
        <button class="btn btn-outline" data-close>বাতিল</button>
        <button class="btn btn-primary" id="pfSave">সেভ</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  ov.querySelector('[data-close]').onclick = () => ov.remove();
  ov.querySelector('#pfSave').onclick = async () => {
    const data = {
      name: $('pfName').value.trim(),
      unit: $('pfUnit').value.trim() || 'পিস',
      wholesalePrice: Number($('pfWhole').value) || 0,
      retailPrice: Number($('pfRetail').value) || 0,
      stockQty: Number($('pfStock').value) || 0,
      lowStockAlert: Number($('pfLow').value) || 5
    };
    if (!data.name) return toast('নাম দিন', 'error');
    if (p) { data.id = p.id; await DB.put('products', data); }
    else { data.createdAt = new Date().toISOString(); await DB.add('products', data); }
    broadcast('data-changed');
    toast('সেভ হয়েছে', 'success');
    ov.remove();
    App.render();
  };
}

// ============ Init ============
(async function init() {
  await openDB();

  // restore session
  const saved = localStorage.getItem('textilepos-user');
  if (saved) {
    try { App.user = JSON.parse(saved); } catch (e) {}
  }

  // if admin exists from storage, render; else show login
  if (App.user) App.page = App.user.role === 'admin' ? 'dashboard' : 'pos';
  await App.render();
})();
</script>
