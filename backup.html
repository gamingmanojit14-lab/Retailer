<!DOCTYPE html><html lang="bn"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ব্যাকআপ — TextilePOS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css">
</head><body>
<div id="app"></div>
<script src="db.js"></script><script src="common.js"></script>
<script>
APP.init('backup',render);
async function render(){
  document.getElementById('pageContent').innerHTML=`
    <h1 class="page-title">💾 ব্যাকআপ ও রিস্টোর</h1>
    <div class="card mb-3">
      <h2 style="font-weight:700;margin:0 0 8px;">📤 ব্যাকআপ ডাউনলোড</h2>
      <p class="text-sm text-slate mb-3">সব ডেটা JSON ফাইলে সেভ হবে। Google Drive / পেনড্রাইভে রাখুন।</p>
      <button class="btn btn-primary btn-block" onclick="dl()">⬇️ ডাউনলোড ব্যাকআপ</button>
    </div>
    <div class="card mb-3">
      <h2 style="font-weight:700;margin:0 0 8px;">📥 রিস্টোর</h2>
      <p class="text-sm text-red mb-3">⚠️ বর্তমান সব ডেটা মুছে যাবে!</p>
      <label class="btn btn-block" style="background:#0f172a;color:#fff;cursor:pointer;">
        ⬆️ ফাইল সিলেক্ট করুন
        <input type="file" accept=".json" style="display:none;" onchange="restore(event)"/>
      </label>
    </div>
    <div class="card" style="background:#eff6ff;border-left:4px solid #2563eb;">
      <div class="text-sm" style="color:#1e40af;">
        <b>💡 টিপস:</b> সপ্তাহে একবার ব্যাকআপ নিন। ফোন হারালেও ডেটা ফিরে পাবেন।
      </div>
    </div>
    <div class="card mt-3" style="background:#fef3c7;border-left:4px solid #f59e0b;">
      <div class="text-sm" style="color:#78350f;">
        <b>⚠️ ডেঞ্জার জোন:</b>
        <button class="btn btn-danger btn-block mt-2" onclick="clearAll()">সব ডেটা মুছে ফেলুন</button>
      </div>
    </div>`;
}
window.dl=async()=>{
  const json=await exportBackup();
  const b=new Blob([json],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download=`textile-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  toast('ব্যাকআপ ডাউনলোড হয়েছে','success');
};
window.restore=async e=>{
  const f=e.target.files[0];
  if(!f) return;
  if(!await confirmBox('সব ডেটা মুছে যাবে! চালিয়ে যাবেন?')) return;
  await importBackup(await f.text());
  toast('✅ রিস্টোর সম্পন্ন','success');render();
};
window.clearAll=async()=>{
  if(!await confirmBox('সব ডেটা মুছে ফেলবেন? ফেরানো যাবে না!')) return;
  for(const s of ['products','categories','suppliers','purchases','customers','sales','payments','employees','expenses'])
    await DB.clear(s);
  toast('সব ডেটা মুছে ফেলা হয়েছে','success');render();
};
</script></body></html>
