<!DOCTYPE html><html lang="bn"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>বাকির তালিকা — TextilePOS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css">
</head><body>
<div id="app"></div>
<script src="db.js"></script><script src="common.js"></script>
<script>
APP.init('dues',render);
async function render(){
  const dues=(await DB.all('customers')).filter(c=>c.due>0).sort((a,b)=>b.due-a.due);
  const total=dues.reduce((s,c)=>s+c.due,0);
  document.getElementById('pageContent').innerHTML=`
    <h1 class="page-title">⚠️ বাকির তালিকা</h1>
    <div class="card mb-3" style="background:#fee2e2;">
      <div class="text-sm">মোট বাকি</div>
      <div style="font-size:22px;font-weight:700;color:#dc2626;">${bdt(total)}</div>
      <div class="text-xs text-slate">${dues.length} জন কাস্টমার</div>
    </div>
    ${dues.map(c=>`
      <div class="card">
        <div class="flex justify-between items-center">
          <div>
            <div style="font-weight:600;">${esc(c.name)}</div>
            <div class="text-xs text-slate">${esc(c.phone||'-')}</div>
          </div>
          <div class="text-right">
            <div class="text-red" style="font-weight:700;">${bdt(c.due)}</div>
            <button class="btn btn-sm mt-1" style="background:#dcfce7;color:#166534;" onclick="payNow(${c.id})">পেমেন্ট</button>
          </div>
        </div>
      </div>`).join('')}
    ${dues.length===0?'<div class="card text-center text-green" style="padding:32px;">🎉 কোনো বাকি নেই!</div>':''}`;
}
window.payNow=(id)=>openModal('pM',`
  <h2 style="font-size:18px;font-weight:700;margin:0 0 16px;">💵 পেমেন্ট গ্রহণ</h2>
  <input type="number" class="input mb-2" placeholder="টাকার পরিমাণ" id="pa"/>
  <select class="input mb-3" id="pm">
    <option value="cash">ক্যাশ</option><option value="bkash">বিকাশ</option>
    <option value="nagad">নগদ</option><option value="rocket">রকেট</option>
    <option value="bank">ব্যাংক</option>
  </select>
  <div class="grid-2">
    <button class="btn btn-outline" onclick="closeModal('pM')">বাতিল</button>
    <button class="btn btn-primary" onclick="savePay(${id})">সেভ</button>
  </div>`);
window.savePay=async id=>{
  const amt=+document.getElementById('pa').value;
  if(!amt) return toast('পরিমাণ দিন','error');
  await collectPayment({customerId:id,amount:amt,method:document.getElementById('pm').value});
  closeModal('pM');toast('✅ পেমেন্ট সম্পন্ন','success');render();
};
</script></body></html>
